# Publishes to PyPI when a GitHub release is published (or when run by hand
# from the Actions tab), with PyPI Trusted Publishing: no API token is stored
# anywhere. One-time setup on pypi.org:
# Account -> Publishing -> Add a pending publisher, with
#   project name  youtube-transcript-api-client
#   owner         veeringindia
#   repository    youtubetranscriptapi-python
#   workflow      publish.yml
#   environment   pypi
# Bump src/youtubetranscriptapi/_version.py before each release: PyPI refuses
# to upload a version twice.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e . && python -m unittest discover -s tests
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
